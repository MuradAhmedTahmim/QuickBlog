<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickBlog - essays and notes on technology, startups, lifestyle and finance." />
    <meta name="theme-color" content="#142D4E" />
    <title>QuickBlog</title>
    <script>
      // Runs before first paint so the correct palette is already on <html>.
      // A saved choice wins; otherwise follow the operating system.
      (function () {
        try {
          var saved = localStorage.getItem('qb-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode or blocked storage - the light default is fine */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
