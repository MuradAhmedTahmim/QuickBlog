server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite writes content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy is invisible until a reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: an unknown path is a client route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
